<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Maps</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Puzzle Maps</h1>

    <div class="controls">
        <button id="getLocation" class="btn">Moja lokalizacja</button>
        <button id="exportMap" class="btn">Pobierz mapę</button>
        <button id="startPuzzle" class="btn" disabled>Rozpocznij puzzle</button>
    </div>

    <div id="locationInfo" class="info-box"></div>

    <div id="map"></div>

    <div id="puzzleContainer" class="puzzle-container hidden">
        <h2>Ułóż puzzle!</h2>
        <div id="puzzleBoard" class="puzzle-board"></div>
        <div id="puzzlePieces" class="puzzle-pieces"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>

</body>
</html>
